<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex">
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%2327315f%27/%3E%3Ctext x=%2716%27 y=%2723%27 font-size=%2720%27 font-family=%27Arial%27 font-weight=%27bold%27 text-anchor=%27middle%27 fill=%27white%27%3EG%3C/text%3E%3C/svg%3E">
    <title>Sedang dalam pemeliharaan — Grizlie Nusantara</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;
            display: grid;
            place-items: center;
            font: 16px/1.6 'Figtree', system-ui, -apple-system, Segoe UI, Arial, sans-serif;
            background: #f5f7fa;
            color: #1d2433;
            text-align: center;
            padding: max(20px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left))
        }

        main {
            width: 100%;
            max-width: 460px;
            background: #fff;
            border: 1px solid #e3e7ee;
            border-radius: 22px;
            padding: clamp(24px, 6vw, 40px);
            box-shadow: 0 18px 50px -24px rgba(18, 20, 28, .25)
        }

        h1 {
            font-family: 'Bricolage Grotesque', 'Trebuchet MS', system-ui, sans-serif;
            font-size: clamp(1.35rem, 5vw, 1.7rem);
            line-height: 1.2;
            margin: .2em 0 .5em;
            text-wrap: balance
        }

        p {
            margin: .6em 0
        }

        small {
            color: #667085
        }

        main svg {
            color: #1f2c7a
        }

        @media(prefers-color-scheme:dark) {
            main svg {
                color: #aab4ff
            }

            body {
                background: #0e1020;
                color: #eceef6
            }

            main {
                background: #151833;
                border-color: #2a2f52
            }

            small {
                color: #a3a9c2
            }
        }
    </style>
</head>

<body>
    <main>
        <svg width="48" height="48" viewBox="0 0 40 40" fill="none" aria-hidden="true" style="color:#1f2c7a">
            <g stroke="currentColor" stroke-width="2.2">
                <ellipse cx="20" cy="10" rx="6" ry="10" />
                <ellipse cx="20" cy="30" rx="6" ry="10" />
                <ellipse cx="10" cy="20" rx="10" ry="6" />
                <ellipse cx="30" cy="20" rx="10" ry="6" />
            </g>
        </svg>
        <h1>Kami sedang melakukan pemeliharaan</h1>
        <p>Toko ditutup sementara untuk perbaikan. Pesanan dan pembayaran Anda yang sudah masuk tetap aman. Silakan
            kembali beberapa saat lagi.</p>
        <p><small>Grizlie Nusantara</small></p>
    </main>
</body>

</html>
